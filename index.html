<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="600" height="700"></canvas>
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="wave">Wave: 1</div>
            <div id="highScore">🏆 High: 0</div>
            <div id="lives"></div>
        </div>
        <button id="pauseBtn" class="hidden" aria-label="Pause">⏸️</button>
        <div id="startScreen">
            <h1>🚀 SPACE SHOOTER</h1>
            <p>Arrow Keys to Move | Auto-Shoot</p>
            <p>P to Pause | Touch & Drag on Mobile</p>
            <button id="startBtn">START GAME</button>
        </div>
        <div id="gameOverScreen" class="hidden">
            <h1>GAME OVER</h1>
            <p id="finalScore">Score: 0</p>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>
        <div id="pauseScreen" class="hidden">
            <h1>⏸️ PAUSED</h1>
            <p>Press P to Resume</p>
            <button id="resumeBtn">RESUME</button>
        </div>
        <div id="waveScreen" class="hidden">
            <h1 id="waveText">WAVE 1</h1>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
